<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <h1>Products</h1>
    <p>These are the products</p>
    {% for p in products %}

        <h2>{{ p[0] }}</h2>
        <h1>{{ p[1] }}</h1>

    </div>
    {% endfor %}
</body>
</html>
